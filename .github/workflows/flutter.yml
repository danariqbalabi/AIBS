name: Flutter

on:
  push:
    paths: ["frontend/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS backend URL (defaults to repository demo configuration)"
        required: false
        type: string
      supabase_publishable_key:
        description: "Public client key only, never a server key"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --concurrency=2
      - name: Build web using Vercel build script
        env:
          API_BASE_URL: https://backend.example
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_compile_check
        run: AIBS_FLUTTER_BIN="$FLUTTER_ROOT/bin/flutter" bash scripts/vercel-build.sh

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build demo APK and provenance
        env:
          AIBS_API_URL: ${{ inputs.api_base_url || vars.AIBS_API_BASE_URL }}
          AIBS_PUBLIC_KEY: ${{ inputs.supabase_publishable_key || vars.AIBS_SUPABASE_PUBLISHABLE_KEY }}
          AIBS_SUPABASE_URL: ${{ vars.AIBS_SUPABASE_URL }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          api = os.environ.get('AIBS_API_URL', '')
          key = os.environ.get('AIBS_PUBLIC_KEY', '')
          if api and not api.startswith('https://'):
              raise SystemExit('Use an HTTPS backend URL')
          if key and not key.startswith('sb_publishable_'):
              raise SystemExit('Use a publishable client key only')
          Path('config/ci.local.json').write_text(json.dumps({
              'API_BASE_URL': api or 'http://10.0.2.2:8000',
              'SUPABASE_URL': os.environ.get('AIBS_SUPABASE_URL') or 'https://fpaposwwnqdtvvjaelar.supabase.co',
              'SUPABASE_PUBLISHABLE_KEY': key,
              'EMAIL_OTP_LENGTH': '8',
          }))
          PY
          flutter build apk --release --target-platform android-arm64 --dart-define-from-file=config/ci.local.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          target = Path('build/app/outputs/flutter-apk')
          apk = target / 'app-release.apk'
          (target / 'SHA256SUMS').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  app-release.apk\n')
          (target / 'build-info.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'architecture': 'android-arm64',
              'connected': bool(os.environ.get('AIBS_API_URL') and os.environ.get('AIBS_PUBLIC_KEY')),
              'api_base_url': os.environ.get('AIBS_API_URL') or None,
              'signing': 'debug key for hackathon demo; not a store release',
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aibs-android-demo
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/flutter-apk/SHA256SUMS
            frontend/build/app/outputs/flutter-apk/build-info.json
          retention-days: 30
